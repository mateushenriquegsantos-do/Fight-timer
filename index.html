<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fight Timer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,sans-serif;
}

body{
    min-height:100vh;
    background:#020617;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.subtitle{
    color:#22d3ee;
    text-transform:uppercase;
    letter-spacing:4px;
    font-size:12px;
}

.title{
    font-size:28px;
    margin-top:4px;
}

.sound-btn{
    width:50px;
    height:50px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    font-size:22px;
    transition:.2s;
}

.sound-on{
    background:rgba(34,211,238,.1);
    color:#22d3ee;
}

.sound-off{
    background:#1e293b;
    color:#64748b;
}

.card{
    background:#0f172a;
    border-radius:32px;
    padding:24px;
}

.presets{
    display:flex;
    gap:8px;
    margin-bottom:20px;
    overflow:auto;
}

.presets button,
.controls button,
.reset-btn{
    border:none;
    border-radius:12px;
    cursor:pointer;
    padding:10px 14px;
    background:#1e293b;
    color:white;
}

.support-btn{
    background: rgba(34,211,238,.12);
    color: #22d3ee;
    border: 1px solid rgba(34,211,238,.3);
    border-radius: 14px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s ease;
    box-shadow: 0 0 12px rgba(34,211,238,.15);
}

.support-btn:hover{
    background: rgba(34,211,238,.2);
    transform: translateY(-2px);
    box-shadow: 0 0 18px rgba(34,211,238,.25);
}

.support-btn:active{
    transform: translateY(0);
}

.presets button:hover{
    background:#334155;
}

.circle{
    width:260px;
    height:260px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.circle-inner{
    position:absolute;
    background:#020617;
    width:240px;
    height:240px;
    border-radius:50%;
}

.timer-content{
    position:relative;
    z-index:2;
    text-align:center;
}

.time{
    font-size:64px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
}

.status{
    color:#94a3b8;
    margin-top:10px;
    font-size:14px;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-top:30px;
}

.main-btn{
    background:#22d3ee !important;
    color:#020617 !important;
    font-weight:bold;
}

.reset-btn{
    width:100%;
    margin-top:14px;
}

.footer{
    margin-top:16px;
    text-align:center;
    color:#64748b;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <div class="subtitle">Lite</div>
            <h1 class="title">Temporizador de luta</h1>
        </div>

        <button id="soundBtn" class="sound-btn sound-on">
            🔊
        </button>
    </div>

    <div class="card">

        <div class="presets">
            <button onclick="choose(1)">1 min</button>
            <button onclick="choose(3)">3 min</button>
            <button onclick="choose(5)">5 min</button>
            <button onclick="choose(10)">10 min</button>
            <button onclick="choose(25)">25 min</button>

        </div>

        <div id="progressCircle" class="circle">
            <div class="circle-inner"></div>

            <div class="timer-content">
                <div id="time" class="time">25:00</div>
                <p id="status" class="status">
                    Pronto para iniciar
                </p>
            </div>
        </div>

        <div class="controls">
            <button onclick="adjust(-1)">➖</button>
            <button id="playBtn" class="main-btn" onclick="toggleRunning()">▶</button>
            <button onclick="adjust(1)">➕</button>
        </div>

        <button class="reset-btn" onclick="resetTimer()">
            🔄 Reiniciar timer
        </button>
        <br>

        <!-- APOIO AO PROJETO -->
        <br>
        <div class="support-box">
            <p style="text-align: center;" style="color: #bdcee5;">
                De lutador para lutador!
            </p>
            <br>

        <div style="text-align: center;">
            <button class="support-btn" onclick="copyPix()">
                ❤️ Apoiar o projeto
            </button>
        </div>

        <div id="footerText" class="footer">
            🕒 Sons ativados
        </div>

    </div>

</div>

<script>
const presets = [
    {label:"Foco",minutes:25},
    {label:"Pausa",minutes:5},
    {label:"Reunião",minutes:30}
];

let initialSeconds = 25 * 60;
let seconds = 25 * 60;
let running = false;
let soundOn = true;
let timer = null;

const startAudio = new Audio("start.mp3");
const endAudio = new Audio("end.mp3");

const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;

const audioCtx = AudioContextClass
    ? new AudioContextClass()
    : null;

startAudio.preload = "auto";
endAudio.preload = "auto";

function playTone({
    frequency = 660,
    duration = 0.16,
    delay = 0,
    volume = 0.12
}){

    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContextClass) return;

    const ctx = new AudioContextClass();

    const start = ctx.currentTime + delay;

    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(900, start);
    oscillator.frequency.exponentialRampToValueAtTime(
        500,
         start + duration    
    );

    gain.gain.setValueAtTime(0.0001,start);
    gain.gain.exponentialRampToValueAtTime(
        volume,
        start + 0.015
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        start + duration
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start(start);
    oscillator.stop(start + duration + 0.02);

    oscillator.onended = () => ctx.close();
}

function playStartSound() {
    startAudio.currentTime = 0;
    startAudio.play();
}

function playEndSound() {
    endAudio.currentTime = 0;
    endAudio.play();
}

function playCountdownSound() {

    if(!audioCtx) return;

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.type = "square";
    oscillator.frequency.value = 1000;

    gain.gain.setValueAtTime(
        0.0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.08,
        audioCtx.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + 0.08
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.08);
}

function updateUI(){

    const mm = String(
        Math.floor(seconds / 60)
    ).padStart(2,"0");

    const ss = String(
        seconds % 60
    ).padStart(2,"0");

    document.getElementById("time")
        .textContent = `${mm}:${ss}`;

    const progress =
        ((initialSeconds - seconds) /
            initialSeconds) * 100;

    const timerColor =
        seconds <= 10 && seconds > 0
            ? "#ef4444"
            : "#22d3ee";

    document.getElementById(
        "progressCircle"
    ).style.background =
        `conic-gradient(
            ${timerColor} ${progress}%,
            #1e293b ${progress}% 100%
        )`;

    document.getElementById("time").style.color =
        seconds <= 10 && seconds > 0
            ? "#ef4444"
            : "#ffffff";

    const status =
        running
            ? "Contagem em andamento"
            : seconds === 0
            ? "Tempo concluído"
            : "Pronto para iniciar";

    document.getElementById("status")
        .textContent = status;

    document.getElementById("playBtn")
        .textContent = running ? "⏸" : "▶";
}

function startInterval(){

    clearInterval(timer);

    timer = setInterval(() => {

        if(seconds > 0){

            seconds--;

            if(soundOn && seconds <= 10 && seconds > 0){
                playCountdownSound();
            }

            updateUI();

        }else{

            clearInterval(timer);
            running = false;
            updateUI();

            if(soundOn){
                playEndSound();
            }
        }

    },1000);
}

function toggleRunning(){

    if(audioCtx && audioCtx.state === "suspended"){
        audioCtx.resume();
    }

    if(seconds === 0) return;

    if(!running && soundOn){
        playStartSound();
    }

    running = !running;

    if(running){
        startInterval();
    }else{
        clearInterval(timer);
    }

    updateUI();
}

function choose(minutes){

    clearInterval(timer);

    running = false;

    seconds = minutes * 60;
    initialSeconds = seconds;

    updateUI();
}

function adjust(delta){

    running = false;
    clearInterval(timer);

    seconds = Math.max(
        60,
        seconds + delta * 60
    );

    initialSeconds = seconds;

    updateUI();
}

function resetTimer(){

    running = false;

    clearInterval(timer);

    seconds = initialSeconds;

    updateUI();
}

document
.getElementById("soundBtn")
.addEventListener("click",()=>{

    soundOn = !soundOn;

    const btn =
        document.getElementById("soundBtn");

    const footer =
        document.getElementById("footerText");

    if(soundOn){

        btn.className =
            "sound-btn sound-on";

        btn.textContent = "🔊";

        footer.textContent =
            "🕒 Sons ativados";

    }else{

        btn.className =
            "sound-btn sound-off";

        btn.textContent = "🔇";

        footer.textContent =
            "🕒 Sons desativados";
    }
});

function copyPix() {
    const chavePix = "cf24c1a4-4fb8-4f2a-adbd-cc578140cee7";

    navigator.clipboard.writeText(chavePix);

    document.getElementById("footerText").textContent =
        "✅ Chave PIX copiada!";
}

updateUI();
</script>

</body>
</html>
